# SeCuardian — DevSecOps 통합 게이트 (E08 T08-2)
# PR 생성/업데이트 시 자동 보안 스캔, Critical 이슈 머지 차단
#
# Required GitHub Secrets:
#   SONAR_TOKEN           — SonarQube 사용자 토큰
#   HARBOR_ROBOT_NAME     — Harbor robot account (robot$secuardian-ci)
#   HARBOR_ROBOT_SECRET   — Harbor robot secret
#   SECUARDIAN_TOKEN      — (선택) SeCuardian MTTD 알림 토큰
# Required GitHub Variables:
#   SONAR_HOST_URL        — http://sonar.example.com:9000
#   HARBOR_URL            — https://harbor.example.com
#   HARBOR_PROJECT        — secuardian
#   SECUARDIAN_URL        — (선택) http://secuardian.example.com
#
# ⚠️ SonarSource/sonarqube-mcp-server: NOASSERTION — 법무 검토 전 포함 금지. REST API 사용.
#
# 실패 조건:
#   secret-scan   : TruffleHog verified 시크릿 발견 → 즉시 실패
#   sast          : SonarQube Quality Gate FAILED → 머지 차단
#   container-scan: Trivy Critical CVE 발견 → 배포 차단

name: DevSecOps Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── 1. Secret Scan (TruffleHog) ─────────────────────────────────────────
  secret-scan:
    name: TruffleHog Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — verified secrets only
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail
        continue-on-error: true

      - name: Notify SeCuardian on secret detected
        if: steps.trufflehog.outcome == 'failure' && vars.SECUARDIAN_URL != ''
        env:
          SECUARDIAN_URL: ${{ vars.SECUARDIAN_URL }}
          SECUARDIAN_TOKEN: ${{ secrets.SECUARDIAN_TOKEN }}
        run: |
          curl -sf -X POST "${SECUARDIAN_URL}/api/observability/mttd/alert" \
            -H "Authorization: Bearer ${SECUARDIAN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"alert_id\": \"trufflehog-${{ github.run_id }}\",
              \"source\": \"devsecops-gate\",
              \"severity\": \"critical\",
              \"result\": \"verified_secret\",
              \"commit\": \"${{ github.sha }}\",
              \"repo\": \"${{ github.repository }}\"
            }" || true

      - name: Fail on verified secrets
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::🔴 검증된 시크릿 발견 — 즉시 로테이션 후 Git 이력에서 제거하세요."
          exit 1

  # ── 2. SAST (SonarQube) ─────────────────────────────────────────────────
  sast:
    name: SonarQube SAST + Quality Gate
    runs-on: ubuntu-latest
    needs: secret-scan
    if: vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=secuardian
            -Dsonar.qualitygate.wait=true

      - name: Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ── 3. Container Scan (Harbor + Trivy) ──────────────────────────────────
  container-scan:
    name: Trivy Critical CVE Check
    runs-on: ubuntu-latest
    needs: secret-scan
    if: vars.HARBOR_URL != ''
    env:
      REGISTRY: ${{ vars.HARBOR_URL }}
      PROJECT: ${{ vars.HARBOR_PROJECT || 'secuardian' }}
      IMAGE_NAME: secuardian
    steps:
      - uses: actions/checkout@v4

      - name: Build image (scan target)
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${REGISTRY}/${PROJECT}/${IMAGE_NAME}:scan-${SHORT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE_TAG}" .

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_ROBOT_SECRET }}" | \
          docker login "$REGISTRY" \
            -u "${{ secrets.HARBOR_ROBOT_NAME }}" \
            --password-stdin

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy — Critical CVE scan (배포 차단)
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format table \
            "$IMAGE_TAG" \
          || { echo "::error::🔴 Critical CVE 발견 — 배포 차단. 기반 이미지를 업데이트하세요."; exit 1; }

  # ── 4. Supply Chain (Phase 2 예약) ──────────────────────────────────────
  supply-chain:
    name: Supply Chain Check (Phase 2)
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, container-scan]
    if: |
      always() &&
      needs.secret-scan.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      (needs.container-scan.result == 'success' || needs.container-scan.result == 'skipped')
    steps:
      - name: Placeholder — chain-bench (E09+ Phase 2)
        run: |
          echo "✅ Supply chain check — chain-bench 통합 예정 (Phase 2)"
          echo "   참조: .docs/ClaudePlan.md §E09"
